services:
  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: airbnb_minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30
    container_name: airbnb_mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    restart: unless-stopped
